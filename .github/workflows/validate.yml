name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node src/regression_contract.test.mjs
      - run: npm run build

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m py_compile backend/app.py backend/depth_map_generator.py backend/anaglyph_generator.py backend/technique_generator.py backend/phantogram_generator.py backend/depth_sources.py backend/stereo_formats.py

  technique-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 pillow==11.0.0
      - run: python backend/test_technique_generator.py
      - run: python backend/test_phantogram_generator.py
